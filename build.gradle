plugins {
    id "org.openapi.generator" version "7.25.0"
}

def group = "com.xingzhi"
def ver = "1.1.0"

// https://github.com/OpenAPITools/openapi-generator/tree/master/modules/openapi-generator-gradle-plugin
// https://openapi-generator.tech/docs/generators
openApiValidate {
    inputSpec.set(layout.projectDirectory.file("doc/swagger.yaml"))
}

openApiGenerate {
    generatorName.set("kotlin")
    inputSpec.set(layout.projectDirectory.file("doc/swagger.yaml"))
    outputDir.set(layout.projectDirectory.dir("api"))
//    remoteInputSpec = "https://openapi.shxzzn.com/swagger/v1/swagger.json"
    groupId.set(group)
    id.set("api")
    version.set(ver)
    packageName.set("com.xingzhi.robot")
    apiPackage.set("com.xingzhi.robot.api")
    modelPackage.set("com.xingzhi.robot.model")
//    modelNameSuffix = "Dto"
//    invokerPackage = "com.xingzhi.robot.invoker"
    configOptions.set([
            library             : "jvm-retrofit2",
            useCoroutines       : "true",
            serializationLibrary: "kotlinx_serialization",
            dateLibrary         : "threetenbp-localdatetime",
            omitGradleWrapper   : "true",
            useSettingsGradle   : "true",
    ])
}

project("api") {
    apply plugin: 'java-library'
    apply plugin: "maven-publish"

    java {
        withJavadocJar()
    }

    jar {
        metaInf {
            from layout.projectDirectory.file('proguard-rules.pro')
            into ("proguard/")
            rename 'proguard-rules.pro', 'api.pro'
        }
    }

    publishing {
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/OpenXingZhi/OpenAPI")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
